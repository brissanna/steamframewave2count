<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Steam Frame Wave 2 Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0D1117;
      --surface: #111922;
      --border: #1E3050;
      --cyan: #00C8F0;
      --white: #E8EEF4;
      --muted: #6B7A8D;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center {
      text-align: center;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    h1 {
      font-size: clamp(24px, 5vw, 48px);
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.01em;
      margin-bottom: 48px;
      max-width: 700px;
      line-height: 1.2;
    }

    .block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .block-label {
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .countdown {
      display: flex;
      gap: clamp(12px, 4vw, 48px);
      justify-content: center;
      align-items: flex-start;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .num {
      font-size: clamp(52px, 12vw, 110px);
      font-weight: 700;
      color: var(--cyan);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: center;
    }

    .lbl {
      font-size: clamp(10px, 1.5vw, 13px);
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .sep {
      font-size: clamp(40px, 9vw, 90px);
      font-weight: 300;
      color: var(--border);
      line-height: 1;
      padding-top: 2px;
      align-self: flex-start;
    }

    .done {
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 600;
      color: var(--cyan);
    }

    .divider {
      width: 1px;
      height: clamp(48px, 8vw, 80px);
      background: var(--border);
      margin: 40px auto;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #F0F4FA;
        --surface: #FFFFFF;
        --border: #C8D4E8;
        --cyan: #0070CC;
        --white: #0D1117;
        --muted: #5A6474;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>When will Steam Frame Reservation Wave 2 Happen?</h1>

    <div class="block">
      <div class="block-label">Wave 2 Reservations Open</div>
      <div id="display-wave2"></div>
    </div>

    <div class="divider"></div>

    <div class="block">
      <div class="block-label">Buy Emails Sent</div>
      <div id="display-emails"></div>
    </div>
  </div>

  <script>
    // Sep 21 2026 10:00 AM PST = UTC-7 = 17:00 UTC
    const targetWave2  = new Date('2026-09-21T17:00:00Z');
    // Sep 22 2026 10:00 AM PST = 17:00 UTC
    const targetEmails = new Date('2026-09-22T17:00:00Z');

    function pad(n) { return String(n).padStart(2, '0'); }

    function countdownHTML(diff) {
      const days    = Math.floor(diff / 86400000);
      const hours   = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000)  / 60000);
      const seconds = Math.floor((diff % 60000)    / 1000);
      return `
        <div class="countdown">
          <div class="unit">
            <span class="num">${pad(days)}</span>
            <span class="lbl">Days</span>
          </div>
          <div class="sep">:</div>
          <div class="unit">
            <span class="num">${pad(hours)}</span>
            <span class="lbl">Hours</span>
          </div>
          <div class="sep">:</div>
          <div class="unit">
            <span class="num">${pad(minutes)}</span>
            <span class="lbl">Minutes</span>
          </div>
          <div class="sep">:</div>
          <div class="unit">
            <span class="num">${pad(seconds)}</span>
            <span class="lbl">Seconds</span>
          </div>
        </div>
      `;
    }

    function render() {
      const now = new Date();

      const diff1 = targetWave2 - now;
      const el1 = document.getElementById('display-wave2');
      if (diff1 <= 0) {
        el1.innerHTML = '<div class="done">Wave 2 is live — check Steam now!</div>';
      } else {
        el1.innerHTML = countdownHTML(diff1);
      }

      const diff2 = targetEmails - now;
      const el2 = document.getElementById('display-emails');
      if (diff2 <= 0) {
        el2.innerHTML = '<div class="done">Emails are going out — check your inbox!</div>';
      } else {
        el2.innerHTML = countdownHTML(diff2);
      }
    }

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
